
name: Build Play Store AAB
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (number, increase by 1 for every new upload)"
        default: "1"
      version_name:
        description: "Version name"
        default: "1.0"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: mkdir www && cp index.html firebase-bridge.js iap-bridge.js www/
      - run: npm install
      - run: npx cap add android
      - name: AdMob app id
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ID\"/></application>#" android/app/src/main/AndroidManifest.xml
      - name: Firebase config (optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > android/app/google-services.json; fi
      - name: App icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p $R/mipmap-$d
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon-$s.png $R/mipmap-$d/$n.png; done
          done
      - name: Set version
        run: |
          sed -i "s/versionCode *=\? *[0-9]\+/versionCode ${{ inputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName *=\? *\"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release bundle
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Sign bundle
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n')
          KS_ALIAS=$(printf '%s' "$KS_ALIAS" | tr -d ' \r\n')
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > upload.jks
          echo "password length: ${#KS_PASS} (expected 20)"
          echo "keystore bytes: $(wc -c < upload.jks) (expected 2636)"
          cp android/app/build/outputs/bundle/release/app-release.aab FreePath-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore upload.jks -storepass "$KS_PASS" FreePath-release.aab "$KS_ALIAS"
          jarsigner -verify FreePath-release.aab | head -3
          rm upload.jks
      - uses: actions/upload-artifact@v4
        with:
          name: FreePath-AAB
          path: FreePath-release.aab
