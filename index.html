<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Free Path</title>
<style>
:root{--ink:#0a0f3a;--title:#3c4663;--blue:#1e88e5;--soft:#eef2f8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
.app{width:min(100%,520px);margin:auto;padding:14px 16px 26px;text-align:center}
h1{margin:6px 0 22px;font-size:clamp(34px,10vw,48px);line-height:1.08;font-weight:800;color:var(--title);letter-spacing:-.5px}
.row{display:flex;align-items:center;justify-content:space-between}
.lvl{font-weight:600;font-size:18px}
#emo{font-size:22px;margin-left:4px}
.ib{background:none;border:0;color:var(--blue);padding:4px;width:40px;height:40px;cursor:pointer}
.ib svg{width:100%;height:100%}
.chip{background:var(--soft);border-radius:12px;padding:10px 16px;font-size:18px;font-weight:600;color:#4c5878;min-width:84px;box-shadow:0 2px 8px #0000000d;display:flex;align-items:center;justify-content:center;gap:8px}
.hearts{font-size:32px;letter-spacing:5px;line-height:1}
.h-off{filter:grayscale(1) opacity(.35)}
#wrap{width:100%;aspect-ratio:1;overflow:auto;margin:16px 0 8px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}#board{display:block;width:100%;aspect-ratio:1}
.tools{display:flex;justify-content:center;gap:24px;margin-top:14px}
.tool{position:relative;width:72px;height:72px;border-radius:50%;border:0;background:#fff;color:var(--blue);box-shadow:0 8px 22px #1e88e533,0 0 0 1px #eef2f8;cursor:pointer;transition:transform .12s}
.tool:active{transform:scale(.93)}
.tool svg{width:34px;height:34px}
.badge{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;border:2px solid #fff}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.levels{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px;max-height:380px;overflow:auto;padding:2px}
.levels.show{display:grid}
.lv.sk{border-color:#8bc34a}.lv{border:1px solid #dbe3ef;background:var(--soft);border-radius:14px;padding:8px 0 6px;font-size:11px;color:#4c5878;cursor:pointer}
.lv b{display:block;font-size:24px;font-weight:400;line-height:1.2}
.lv.cur{border:2px solid var(--blue);background:#fff}
.lv:disabled{opacity:.35;cursor:not-allowed}
.prep{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.75);z-index:8}.prep.show{display:flex}.pp{display:flex;gap:12px;align-items:center;background:#fff;padding:14px 20px;border-radius:14px;font-weight:700;color:var(--title);box-shadow:0 4px 20px rgba(10,15,58,.18)}.pp i{width:20px;height:20px;border:3px solid #cfd8e8;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;max-width:92vw;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#0a0f3a99;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.card{width:min(100%,340px);background:#fff;border-radius:26px;padding:28px 24px;box-shadow:0 24px 70px #0006}
.card .e{font-size:52px}.card h2{margin:8px 0 6px}.card p{color:#5a6685;font-size:14px;line-height:1.6;margin:0 0 12px}
.btn{width:100%;min-height:50px;border-radius:15px;border:0;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.go{background:var(--blue);color:#fff}.no{background:var(--soft);color:var(--ink)}
.dwrap{position:relative}
button.chip{border:0;font-family:inherit;cursor:pointer;color:#4c5878}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 12px 30px #0a0f3a30;z-index:6;overflow:hidden;min-width:200px;text-align:left}
.menu.show{display:block}
.menu button{display:block;width:100%;background:none;border:0;padding:12px 16px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
.menu button small{display:block;font-weight:400;color:#6a7694;font-size:12px;margin-top:2px}
.menu button.on{background:var(--soft);color:var(--blue)}
#zoom{font:700 20px "Segoe UI",system-ui,sans-serif}
.ad{position:fixed;inset:0;background:#05081f;color:#fff;display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.ad.show{display:flex}
.adb{width:min(100%,340px);text-align:center}
.adb small{letter-spacing:2px;color:#8fa0e8}
.adbox{height:200px;border:2px dashed #3b4a8a;border-radius:18px;display:grid;place-items:center;font-size:20px;margin:14px 0;color:#9fb0ff}
.aud{display:flex;justify-content:center;gap:10px;margin-top:18px}
.pill{border:1px solid #dbe3ef;background:var(--soft);color:#4c5878;border-radius:99px;padding:9px 16px;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.pill.off{opacity:.5}
.topbar{display:flex;justify-content:space-between;align-items:center}
.coins{display:flex;align-items:center;gap:8px;border:1px solid #f0cf72;background:linear-gradient(145deg,#fff8e1,#ffecb0);border-radius:99px;padding:6px 15px 6px 7px;font-weight:800;font-size:17px;color:#8a5a00;box-shadow:0 4px 14px #f0b43033}
.coins i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb52e 60%,#d9840f);display:grid;place-items:center;font-style:normal;font-size:14px;color:#7a4300}
.coinfly{position:fixed;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffb52e 60%,#d9840f);color:#7a4300;font:800 14px/26px sans-serif;text-align:center;pointer-events:none;z-index:12;box-shadow:0 2px 8px #0006}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.coins{cursor:pointer}
.shopbtn{border:1px solid #dbe3ef;background:var(--soft);color:var(--blue);border-radius:99px;padding:8px 15px;font:700 15px "Segoe UI",system-ui,sans-serif;cursor:pointer}
#wrap{border-radius:16px}
#wrap.bg-dark{background:#0d1330}
#wrap.bg-paper{background:radial-gradient(#fffaf0,#efe3c6)}
#wrap.bg-star{background:radial-gradient(1.5px 1.5px at 20px 30px,#fff 50%,#0000 51%),radial-gradient(1px 1px at 90px 80px,#fff9 50%,#0000 51%),radial-gradient(1.5px 1.5px at 140px 20px,#ffe9a8 50%,#0000 51%),radial-gradient(1px 1px at 60px 130px,#fff 50%,#0000 51%),linear-gradient(#070b2e,#1a1f5c);background-size:160px 160px,160px 160px,160px 160px,160px 160px,100% 100%;background-attachment:local}
.shop{position:fixed;inset:0;background:#fff;z-index:9;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.shop.show{display:block}
.shopin{width:min(100%,520px);margin:auto;padding:env(safe-area-inset-top,0px) 16px 40px}
.shophd{position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 0;font-size:20px}
.shophd b{flex:1;text-align:left}
.sec{margin:20px 0 6px;text-align:left;font-weight:800;font-size:17px;color:var(--title)}.sec small{font-weight:400;font-size:12px;color:#6a7694}
.sub{margin:14px 0 6px;text-align:left;font-weight:700;font-size:14px;color:#4c5878}
.it{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #dbe3ef;border-radius:16px;margin:8px 0;text-align:left;background:#fff}
.ie{font-size:30px;width:38px;text-align:center}.tx{flex:1;min-width:0}.tx b{display:block;font-size:15px}.tx small{display:block;color:#6a7694;font-size:12px;line-height:1.45;margin-top:2px}
.buy{border:1px solid #f0cf72;border-radius:99px;padding:9px 14px;font:700 14px "Segoe UI",system-ui,sans-serif;background:linear-gradient(145deg,#fff8e1,#ffecb0);color:#8a5a00;cursor:pointer;white-space:nowrap}
.buy.low,.opt.low{opacity:.5}
.adsbox{border:2px dashed #f0cf72;background:#fffbea}
.buy.ad{background:var(--blue);border-color:var(--blue);color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.opt{border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:10px 4px;font-family:inherit;color:var(--ink);cursor:pointer}
.opt .oe{display:block;font-size:26px}.opt b{display:block;font-size:13px;margin-top:2px}.opt small{display:block;font-size:12px;color:#8a5a00;margin-top:2px;font-weight:600}
.opt.on{border:2px solid var(--blue);background:var(--soft)}.opt.on small{color:var(--blue)}
.note{color:#6a7694;font-size:12px;line-height:1.6;text-align:left;margin-top:18px}
.tr{display:flex;align-items:center;gap:8px}
.ib.sm{width:36px;height:36px}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--blue);color:#fff;font:800 16px "Segoe UI",system-ui,sans-serif;box-shadow:0 0 0 1px #dbe3ef;cursor:pointer;padding:0}
.reg{position:fixed;inset:0;background:#fff;z-index:25;display:none;overflow:auto;align-items:center;justify-content:center;padding:24px}
.reg.show{display:flex}
.regin{width:min(100%,360px);text-align:left}
.regin .e{font-size:52px;text-align:center}.regin h2{text-align:center;margin:8px 0 4px}
.regin p{color:#5a6685;font-size:14px;line-height:1.6;text-align:center;margin:0}
.regin label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px;color:#4c5878}
.regin input,.pin{width:100%;height:48px;border:1px solid #dbe3ef;border-radius:13px;padding:0 14px;font:600 16px "Segoe UI",system-ui,sans-serif;background:var(--soft);color:var(--ink)}
.ph{display:flex;gap:8px}.ph #rCC{width:76px;flex:none;text-align:center;padding:0 6px}
.rerr{color:#d32f2f;font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.regin .note{text-align:center}
.pav{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;font:800 38px/84px "Segoe UI",system-ui,sans-serif;margin:10px auto 8px}
.pname{font-size:22px;font-weight:800}.pph{color:#6a7694;font-size:14px;margin-top:4px}
.vf{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;background:#e3f6e8;color:#1b8a3a;font-size:12px;font-weight:700}.vf.no{background:#fdecea;color:#c62828}
.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stg div{background:var(--soft);border-radius:14px;padding:12px 4px}.stg b{display:block;font-size:20px}.stg small{display:block;font-size:11px;color:#6a7694;margin-top:2px}
.pf{text-align:left}
.aud{flex-wrap:wrap;row-gap:10px}
.lv i{display:block;font-style:normal;font-size:9px;line-height:1;margin-top:3px;min-height:10px}
.avatar.em{background:var(--soft);font-size:22px;line-height:34px}
.pav.em{background:var(--soft);font-size:46px}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.dd{border:1px solid #dbe3ef;background:var(--soft);border-radius:14px;padding:8px 2px}
.dd small{display:block;font-size:11px;color:#6a7694}
.dd span{display:block;font-size:22px;line-height:1.3}
.dd b{display:block;font-size:13px;color:#8a5a00}
.dd.got{background:#e3f6e8;border-color:#a8dbb5}
.dd.today{border:2px solid var(--blue);background:#fff}
.dd.big{grid-column:span 2}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.bd{background:var(--soft);border-radius:14px;padding:10px 4px;text-align:center}
.bd span{display:block;font-size:28px;line-height:1.2}
.bd b{display:block;font-size:12px;margin-top:2px}
.bd small{display:block;font-size:10px;color:#6a7694;line-height:1.3;margin-top:2px}
.bd em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--blue);margin-top:3px}
.bd.lock span,.bd.lock b{filter:grayscale(1);opacity:.45}
.lbr{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #dbe3ef;border-radius:14px;margin:6px 0;text-align:left;background:#fff}
.lbr.me{background:#eef6ff;border:2px solid var(--blue)}
.lbr .rk{width:30px;font-weight:800;color:#6a7694;text-align:center;font-size:18px}
.lbr .av{font-size:26px}
.lbr .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .pt{font-weight:800;color:#8a5a00;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Capacitor plain-HTML fix: core runtime lacks registerPlugin/getPlatform, so provide them from native Plugins */
(function(){var C=window.Capacitor;if(!C)return;
if(typeof C.getPlatform!=='function')C.getPlatform=function(){return 'android'};
if(typeof C.registerPlugin!=='function'){C.registerPlugin=function(n){var P=C.Plugins=C.Plugins||{};if(P[n])return P[n];
var stub=new Proxy({},{get:function(t,k){if(k==='then')return undefined;return function(){return Promise.reject(new Error(n+' unavailable'))}}});return stub}}})();

<script>
/* TEMP DEBUG overlay: shows errors on screen */
(function(){var d=document.createElement('div');d.id='dbg';d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.88);color:#7CFC00;font:11px/1.35 monospace;padding:6px;max-height:42vh;overflow:auto;pointer-events:none;white-space:pre-wrap;word-break:break-all';
function add(t){d.textContent+=t+'\n'}
function mount(){if(!d.parentNode)(document.body||document.documentElement).appendChild(d)}
window.addEventListener('error',function(e){mount();add('ERR: '+e.message+' @'+(e.lineno||'')+':'+(e.colno||''))});
window.addEventListener('unhandledrejection',function(e){mount();add('REJ: '+(e.reason&&e.reason.message||e.reason))});
var ce=console.error;console.error=function(){try{mount();add('CE: '+[].slice.call(arguments).map(function(a){return a&&a.stack?a.stack.split('\n').slice(0,3).join(' | '):String(a)}).join(' '))}catch(x){}ce.apply(console,arguments)};
window.addEventListener('load',function(){setTimeout(function(){mount();var w=document.getElementById('wrap'),b=document.getElementById('board');
add('UA: '+navigator.userAgent.replace(/.*(Chrome\/[0-9.]+).*/,'$1'));
add('aspect-ratio supported: '+(window.CSS&&CSS.supports&&CSS.supports('aspect-ratio','1')));
add('wrap h='+(w&&w.clientHeight)+' w='+(w&&w.clientWidth)+' | board children='+(b&&b.children.length)+' h='+(b&&b.clientHeight));
},4000)});
})();
</script>
<script>
/* TEMP DEBUG: shows errors and board size on screen */
(function(){var box=document.createElement('div');box.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:#000c;color:#fff;font:11px monospace;padding:6px;z-index:99999;white-space:pre-wrap';
function add(t){box.textContent+=t+'\n'}
window.addEventListener('error',function(e){add('ERR: '+e.message+' @'+(e.lineno||''))});
window.addEventListener('unhandledrejection',function(e){add('REJ: '+(e.reason&&e.reason.message||e.reason))});
document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(box)});
setTimeout(function(){try{var w=document.getElementById('wrap'),b=document.getElementById('board');
add('UA: '+navigator.userAgent.replace(/.*Chrome\//,'Chrome/').slice(0,40));
add('aspect-ratio: '+(CSS.supports&&CSS.supports('aspect-ratio','1')));
add('wrap: '+w.clientWidth+'x'+w.clientHeight+'  board: '+b.clientWidth+'x'+b.clientHeight+'  kids: '+b.children.length)}catch(e){add('diag fail '+e.message)}},3000);})();

</head>
<body>
<main class="app">
  <div class="topbar"><button class="shopbtn" id="shopbtn" data-t="shop">🛒 Shop</button><div class="tr"><button class="ib sm" id="sharebtn" aria-label="Share the game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button><div class="coins" id="coinbox"><i>★</i><span id="coins">0</span></div><button class="avatar" id="profbtn" aria-label="Profile">?</button></div></div>
  <h1 data-th="title">Find the<br>Free Path</h1>
  <div class="row">
    <button class="ib" id="restart" aria-label="Restart level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl"><span data-t="level">Level</span> <span id="level">1</span><span id="emo"></span></div>
    <button class="ib" id="gear" aria-label="Choose level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3L7 21M17 3l-2 18M3 9h18M2 15h18"/></svg></button>
  </div>
  <div class="row" style="margin-top:6px">
    <div class="chip"><svg width="20" height="20" viewBox="0 0 24 24" fill="#4c5878"><path d="M3 21l3-9 5 5zM9 15L21 3l-3 12-5 3z"/></svg><span id="left">0</span></div>
    <div class="hearts" id="lives"></div>
    <div class="dwrap"><button class="chip" id="diff">Easy ▾</button><div class="menu" id="menu">
      <button data-d="easy"><span data-t="easy">Easy</span><small>80–100 <span data-t="arrows">arrows</span></small></button>
      <button data-d="normal"><span data-t="normal">Normal</span><small>150–200 <span data-t="arrows">arrows</span></small></button>
      <button data-d="hard"><span data-t="hard">Difficult</span><small>400–450 <span data-t="arrows">arrows</span></small></button></div></div>
  </div>
  <div id="wrap"><svg id="board" viewBox="0 0 600 600" role="img" aria-label="Arrow maze board"></svg></div>
  <div class="tools">
    <button class="tool" id="hint" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hints">3</span></button>
    <button class="tool" id="zoom" aria-label="Zoom">1×</button>
    <button class="tool" id="grid" aria-label="Choose level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 3L7 21M17 3l-2 18M3 9h18M2 15h18"/></svg></button>
  </div>
  <div class="aud"><button class="pill" id="sfx">🔊 Sound</button><button class="pill" id="mus">🎵 Music</button><button class="pill" id="langb">🌐 English</button><button class="pill" id="dailyb">🎁</button><button class="pill" id="lbb">🏆</button><button class="pill" id="chb">🧩</button></div>
  <div class="levels" id="levels"></div>
</main>
<div class="prep" id="prep"><div class="pp"><i></i><span data-t="prep">Preparing puzzle…</span></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card"><div class="e" id="mE">🏆</div><h2 id="mT">Level cleared!</h2><p id="mP"></p><button class="btn go" id="mNext">Next level</button><button class="btn go" id="mThird" style="display:none;background:#f5a623"></button><button class="btn no" id="mClose">Close</button></div></div>
<div class="reg" id="reg"><div class="regin"><div class="e">🎯</div><h2 data-t="welcome">Welcome to Free Path</h2><p data-t="welcomeP">Create your player profile to save your progress and coins.</p>
<div id="regA"><label for="rName" data-t="yourName">Your name</label><input id="rName" maxlength="20" autocomplete="name" placeholder="e.g. Arjun" data-tp="phName"><label for="rPh" data-t="mobile">Mobile number</label><div class="ph"><input id="rCC" value="+91" inputmode="tel" maxlength="5" aria-label="Country code"><input id="rPh" type="tel" inputmode="numeric" maxlength="15" placeholder="10-digit number" data-tp="phPh" autocomplete="tel-national"></div><button class="btn go" id="rGo" data-t="cont" style="margin-top:18px">Continue</button></div>

// Raga: tanpura drone (Pa-Sa-Sa-low Sa) + a slow random walk up and down the raga's scale, returning to Sa every 16 steps.
function playRaga(i,t,R){
 const m=AUD.mg,root=50,sc=R.sc,n=sc.length,top=n*2-1,home=i%16===15;
 tone(NOTE([root-5,root,root,root-12][i%4]),t,1.8,'triangle',.07,m);
 if(home||i%2===0||Math.random()<.4){
  AUD.deg=home?n:Math.max(0,Math.min(top,(AUD.deg==null?n:AUD.deg)+[-2,-1,-1,0,1,1,2][rand(7)]));
  const d=AUD.deg,f=root+12+sc[d%n]+12*Math.floor(d/n);
  tone(NOTE(f),t,home?1.4:.9,'sine',.12,m);tone(NOTE(f+12),t,.6,'sine',.02,m);
 }
 if(i%8===0)tone(NOTE(root+24),t+.01,2,'sine',.03,m);
}

// ---- Daily puzzle + weekly special: identical for every player (seeded, math-drawn shape, fixed Indian date) ----
const hashS=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const mul32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const istDate=()=>new Date(Date.now()+19800000);
const chDay=()=>istDate().toISOString().slice(0,10);
const chWeek=()=>{const d=istDate(),w=(d.getUTCDay()+6)%7;return new Date(d.getTime()-w*86400000).toISOString().slice(0,10)};
const chKey=()=>chKind==='w'?chWeek():chDay();
const CH_K=['circle','diamond','heart','ring','plus','hex'];
function shapeMask(k,G){const m=[];for(let y=0;y<G;y++)for(let x=0;x<G;x++){const u=(x+.5)/G*2-1,v=(y+.5)/G*2-1,au=Math.abs(u),av=Math.abs(v);let o;
 if(k==='circle')o=u*u+v*v<.9;
 else if(k==='diamond')o=au+av<.95;
 else if(k==='heart'){const a=u*1.15,b=-v*1.15+.2,t=a*a+b*b-1;o=t*t*t-a*a*b*b*b<=0}
 else if(k==='ring'){const r=u*u+v*v;o=r<.95&&r>.18}
 else if(k==='plus')o=(au<.36&&av<.95)||(av<.36&&au<.95);
 else o=au<=.85&&au*.5+av*.866<=.85;
 m.push(o)}return m}
async function chPrep(tok){
 const h=hashS('fp-'+chKind+'-'+chKey()),kind=CH_K[h%CH_K.length],cfg=chKind==='w'?CFG.hard:CFG.normal,mid=(cfg.lo+cfg.hi)/2;
 GR=mul32(h);SNAKE=((h>>>7)&1)===1;
 const f=shapeMask(kind,24).filter(Boolean).length/576;
 GRID=Math.max(18,Math.min(cfg.max,Math.ceil(Math.sqrt(mid*cfg.cpa/f))));CELL=SIZE/GRID;
 MASK=shapeMask(kind,GRID);COL='hsl('+(h%360)+',72%,42%)';
 try{const r=await generate(tok);if(!r)return;snakes=r;total=snakes.length}finally{GR=Math.random}
}

const FP_KEYS=['fp_meta','fp_daily','fp_ch'];
function snapshot(){const o={v:1,t:Date.now(),name:PROF.name||'',avatar:PROF.avatar||'rabbit',sig:(()=>{try{return localStorage.getItem('fp_sig')||''}catch(e){return ''}})()};FP_KEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v)o[k]=v}catch(e){}});return JSON.stringify(o)}

async function cloudPush(){if(!cloudOn())return false;try{await window.FREEPATH_CLOUD_SAVE(PROF.phone,snapshot());return true}catch(e){return false}}
function peek(str){try{const o=JSON.parse(str);if(!o||o.v!==1||!o.fp_meta||o.sig!==cyrb(SEAL_KEYS.map(k=>o[k]||'').join('|'),SALT))return null;const m=JSON.parse(o.fp_meta);return{o,lvl:+m.level||1,c:+m.coins||0}}catch(e){return null}}
function applySnap(o){
 try{FP_KEYS.forEach(k=>{if(o[k])localStorage.setItem(k,o[k]);else localStorage.removeItem(k)});localStorage.removeItem('fp_state2');seal();

}

// ---- Integrity: saved progress is sealed with a checksum; hand-edited saves are rejected and reset. ----
const SALT=1851529795;
const cyrb=(t,sd)=>{let h1=0xdeadbeef^sd,h2=0x41c6ce57^sd;for(let i=0,c;i<t.length;i++){c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const SEAL_KEYS=['fp_meta','fp_daily','fp_ch'];
const sealStr=()=>SEAL_KEYS.map(k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}).join('|');
function seal(){try{localStorage.setItem('fp_sig',cyrb(sealStr(),SALT));localStorage.setItem('fp_sealed','1')}catch(e){}}
function sealOk(){try{const g=localStorage.getItem('fp_sig');if(!g)return !localStorage.getItem('fp_sealed');return g===cyrb(sealStr(),SALT)}catch(e){return true}}
if(!sealOk()){TAMPER=true;try{['fp_meta','fp_daily','fp_ch','fp_state2','fp_sig','fp_sealed'].forEach(k=>localStorage.removeItem(k))}catch(e){}}

try{Object.assign(DAILY,JSON.parse(localStorage.getItem('fp_daily')||'{}'))}catch(e){}
